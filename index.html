<!DOCTYPE html>
<html>
<head>
<title>Simple HTML Editor</title>
<link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">
<script src="https://tikzjax.com/v1/tikzjax.js"></script>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    margin: 0;
    overflow: hidden;
  }

  #editor-container {
    width: calc(50% - 1px);
    height: 100vh;
    box-sizing: border-box;
    border-right: 1px solid #ccc;
    display: flex;
    flex-direction: column;
  }

  #editor {
    flex-grow: 1;
    box-sizing: border-box;
    padding: 10px;
    font-family: monospace;
    font-size: 1em;
    border: none;
    outline: none;
    resize: none;
  }

  #preview-container {
    width: 50vw;
    height: 100vh;
    position: relative;
  }

  #preview-content {
    width: 100%;
    height: 100%;
  }

  svg {
    width: 100%;
    height: auto;
  }

  #render-button {
    position: absolute;
    bottom: 10px;
    left: 10px;
    padding: 8px 15px;
    background-color: #2196F3;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1em;
  }

  #render-button:hover {
    background-color: #1976D2;
  }
</style>
</head>
<body>
<div id="editor-container">
  <textarea id="editor">
<script type="text/tikz">
\begin{tikzpicture}
  \draw (0,0) circle (1in);
  \draw (0,0) -- (1,1);
  \node[above right] at (1,1) {A};
\end{tikzpicture}
</script>
  </textarea>
</div>
<div id="preview-container">
  <div id="preview-content"></div>
  <button id="render-button" onclick="location.reload()">Render</button>
</div>
<script>
  const editor = document.getElementById('editor');
  const previewContent = document.getElementById('preview-content');
  const LOCAL_STORAGE_KEY = 'tikzEditorContent';

  // load content from localStorage on page load
  document.addEventListener('DOMContentLoaded', () => {
    const savedContent = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (savedContent) {
      editor.value = savedContent;
    }
    renderTikz();
  });

  function renderTikz() {
    const text = editor.value;
    previewContent.innerHTML = text;

    const existingScripts = previewContent.querySelectorAll('script[type="text/tikz"]');
    existingScripts.forEach(script => script.remove());

    const newScript = document.createElement('script');
    newScript.type = 'text/tikz';
    newScript.textContent = text.substring(text.indexOf('\\begin{tikzpicture}'), text.lastIndexOf('\\end{tikzpicture}') + '\\end{tikzpicture}'.length);
    previewContent.appendChild(newScript);

    if (typeof tikzjax !== 'undefined') {
      if (tikzjax.isReady) {
        tikzjax.rerender();
      } else {
        tikzjax.then(() => {
          tikzjax.rerender();
        });
      }
    } else {
      console.error("tikzjax is not defined.  Make sure the script is loaded correctly.");
    }

    // save content to localStorage
    localStorage.setItem(LOCAL_STORAGE_KEY, text);
  }
</script>
</body>
</html>
